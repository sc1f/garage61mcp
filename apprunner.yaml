# AWS App Runner build/run config (source-based deployment, no Docker needed).
# Secrets (GARAGE61_MCP_ACCESS_KEY) are set as service env vars, never here.
version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install .
run:
  command: garage61-mcp-http
  network:
    port: 8080
  env:
    - name: HOST
      value: "0.0.0.0"
    - name: PORT
      value: "8080"
